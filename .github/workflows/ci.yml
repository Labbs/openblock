name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from the "packageManager" field of package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Unused files / exports / dependencies (knip) and unused CSS classes
      - name: Dead code
        run: pnpm deadcode
      # Build first: the react package and the example type-check against the built core
      - run: pnpm build
      - run: pnpm typecheck
      # Fails on known vulnerabilities in the dependencies shipped to users
      - name: Audit production dependencies
        run: pnpm audit --prod
